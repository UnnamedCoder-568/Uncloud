[package]
name = "app"
version = "0.4.3"
description = "Local-first AI studio desktop application"
authors = ["Uncloud contributors"]
license = ""
repository = "https://github.com/UnnamedCoder-568/Uncloud"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
reqwest = { version = "0.13.3", features = ["json"] }
tokio = { version = "1.53.1", features = ["rt", "time", "macros"] }
tauri-plugin-updater = "2"
semver = "1"

# Used to signal the engine's whole process group on quit, so model
# servers spawned by the engine do not outlive the app.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
