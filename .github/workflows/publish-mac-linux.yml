name: Publish verified Mac and Linux 0.4.8
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-mac-linux.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 35963335100
          pattern: uncloud-*
          path: release
          merge-multiple: true
      - name: Verify artifacts and create platform-specific update manifest
        shell: python
        run: |
          import pathlib, json, hashlib, datetime
          root = pathlib.Path('release')
          platforms = {'darwin-aarch64': 'Uncloud-macOS-Apple-Silicon.app.tar.gz', 'linux-x86_64': 'Uncloud-Linux-x64.AppImage'}
          required = ['Uncloud-macOS-Apple-Silicon.dmg', *platforms.values()]
          for name in required:
              assert (root / name).is_file(), name
          entries = {}
          for platform, name in platforms.items():
              sig = (root / (name + '.sig')).read_text().strip()
              assert sig, name
              entries[platform] = {'signature': sig, 'url': 'https://github.com/UnnamedCoder-568/Uncloud/releases/download/v0.4.8/' + name}
          notes = 'Uncloud 0.4.8: guided feature setup and repair, responsive startup, live model discovery, thinking spheres and web-search fallback. This release is available for Apple silicon Macs and Linux x64. Windows remains on v0.4.7 pending installer verification.'
          (root / 'latest.json').write_text(json.dumps({'version': '0.4.8', 'notes': notes, 'pub_date': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'platforms': entries}, indent=2))
          (root / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256((root / name).read_bytes()).hexdigest() + '  ' + name + '\n' for name in required))
      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v0.4.8
          name: Uncloud v0.4.8 — macOS and Linux
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Available now for Apple silicon Macs and Linux x64 using the verified artifacts from release build 35963335100.

            Includes guided runtime setup and repair, training and quantization readiness checks, responsive startup, live model discovery, thinking sphere loading states, image generation step counts, and web-search fallback.

            Windows v0.4.8 is not published because installer verification failed. Windows testers should continue using v0.4.7 until a verified replacement is available.
          files: release/*
