[project]
name = "uncloud-engine"
version = "0.3.0rc1"
description = "Local inference engine for the Uncloud desktop application"
readme = "README.md"
# Bounded, not just floored. Unbounded, uv on a clean machine picks the newest
# Python it can find, and several dependencies here — curated-tokenizers among
# them — publish no wheel for it, so uv falls back to building from source and
# fails. The bundled app has no .python-version to fall back on; this line is
# what travels with it.
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    # Conversations are encrypted at rest, with the key in the OS keychain.
    "cryptography>=44",

    "demucs>=4.0.1",
    "diffusers>=0.39.0",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "gguf>=0.19.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.28.0",
    "keyring>=25.6",
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "kokoro>=0.9.4",
    # Kokoro tokenises English with spaCy and fetches this model from GitHub the
    # first time it speaks. Undeclared, that download happened at first use —
    # so speech worked on a connected machine and failed on an aeroplane, which
    # is the one place someone reaches for a local voice. Pinned here it is
    # installed with everything else, while there is a connection by definition.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "mflux>=0.19.0 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "mlx-lm>=0.28 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "mlx-vlm>=0.4.4 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "trafilatura>=2.2.0",
    "uvicorn[standard]>=0.52.3",
    "websockets>=17.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.13,<1",
]

# Matched to Uncloud Studio's configuration deliberately. Core is byte-identical
# in both repositories, so two different rulesets would mean code that is clean
# on one side and not the other — and the `noqa` comments needed to satisfy one
# become "unused directive" errors in the other.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares multipart parameters via File()/Form() in argument
# defaults. B008 is correct in general and wrong here.
"uncloud_engine/main.py" = ["B008"]
